workflows:
  android-workflow:
    name: Android Workflow
    max_build_duration: 120
    instance_type: mac_mini_m1
    environment:
      flutter: stable
      java: 11
      xcode: latest
    cache:
      cache_paths:
        - $FLUTTER_ROOT/.pub-cache
        - ~/.gradle/caches
    triggering:
      events:
        - push
        - pull_request
      branch:
        include_patterns:
          - main
          - develop
    scripts:
      - name: Get Flutter packages
        script: |
          flutter pub get
      
      - name: Run code analysis
        script: |
          flutter analyze
      
      - name: Run tests
        script: |
          flutter test --coverage 2>/dev/null || true
      
      - name: Build APK with Flutter
        script: |
          flutter build apk \
            --release \
            --build-number=$BUILD_NUMBER \
            --build-name=1.0.$BUILD_NUMBER
    
    artifacts:
      - build/app/outputs/flutter-apk/*.apk
      - coverage/lcov.info

  ios-workflow:
    name: iOS Workflow
    max_build_duration: 120
    instance_type: mac_mini_m1
    environment:
      flutter: stable
      xcode: latest
    cache:
      cache_paths:
        - $FLUTTER_ROOT/.pub-cache
        - $HOME/Library/Developer/Xcode/DerivedData
    triggering:
      events:
        - push
        - pull_request
      branch:
        include_patterns:
          - main
          - develop
    scripts:
      - name: Get Flutter packages
        script: |
          flutter pub get
      
      - name: Run code analysis
        script: |
          flutter analyze
      
      - name: Build iOS app
        script: |
          flutter build ios \
            --release \
            --build-number=$BUILD_NUMBER \
            --build-name=1.0.$BUILD_NUMBER
    
    artifacts:
      - build/ios/ipa/*.ipa

  web-workflow:
    name: Web Workflow
    max_build_duration: 60
    instance_type: linux_x2
    environment:
      flutter: stable
    cache:
      cache_paths:
        - $FLUTTER_ROOT/.pub-cache
    scripts:
      - name: Get Flutter packages
        script: |
          flutter pub get
      
      - name: Run code analysis
        script: |
          flutter analyze
      
      - name: Build web app
        script: |
          flutter build web --release
    
    artifacts:
      - build/web

  pr-checks:
    name: PR Checks
    max_build_duration: 60
    instance_type: linux_x2
    environment:
      flutter: stable
    triggering:
      events:
        - pull_request
    scripts:
      - name: Get Flutter packages
        script: |
          flutter pub get
      
      - name: Run code analysis
        script: |
          flutter analyze
      
      - name: Run tests
        script: |
          flutter test --coverage
      
      - name: Check formatting
        script: |
          flutter format --set-exit-if-changed lib/
    
    artifacts:
      - coverage/lcov.info
