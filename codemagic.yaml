workflows:
  android-workflow:
    name: VoxStudio AI APK Build
    max_build_duration: 60
    instance_type: mac_mini_m1
    environment:
      flutter: stable
      java: 17
    scripts:
      - name: Create Flutter Android Files
        script: |
          flutter create --platforms=android --org=com.voxstudio.ai .
      - name: Get dependencies
        script: |
          flutter pub get
      - name: Build APK
        script: |
          flutter build apk --release --no-tree-shake-icons
    artifacts:
      - build/app/outputs/flutter-apk/*.apk

      
