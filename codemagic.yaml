workflows:
  android-workflow:
    name: Android Workflow
    max_build_duration: 60
    instance_type: mac_mini_m2
    environment:
      flutter: stable
    scripts:
      - name: Recreate Android Folder
        script: |
          rm -rf android
          flutter create . --platforms=android --project-name voxstudio_ai --org com.example
          echo "flutter.minSdkVersion=23" >> android/local.properties
      - name: Build APK
        script: |
          flutter clean
          flutter pub get
          flutter build apk --release
    artifacts:
      - build/**/outputs/**/*.apk
