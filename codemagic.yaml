workflows:
  android-workflow:
    name: Build Android APK
    max_build_duration: 30
    instance_type: mac_mini_m1
    scripts:
      - name: Set up Flutter
        script: |
          flutter channel stable
          flutter upgrade
      - name: Create Android Project Structure & Fix V2 Embedding
        script: |
          rm -rf android
          flutter create --force --org com.voxstudio.app --platforms=android .
          mkdir -p android/app/src/main/kotlin/com/voxstudio/app
          cat <<'EOF' > android/app/src/main/kotlin/com/voxstudio/app/MainActivity.kt
          package com.voxstudio.app

          import io.flutter.embedding.android.FlutterActivity

          class MainActivity: FlutterActivity() {
          }
          EOF
          cat <<'EOF' > android/app/src/main/AndroidManifest.xml
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">
              <uses-permission android:name="android.permission.INTERNET"/>
              <application
                  android:label="VoxStudio AI"
                  android:name="${applicationName}"
                  android:icon="@mipmap/ic_launcher">
                  <meta-data
                      android:name="flutterEmbedding"
                      android:value="2" />
                  <meta-data
                      android:name="com.google.android.gms.ads.APPLICATION_ID"
                      android:value="ca-app-pub-3940256099942544~3347511713"/>
                  <activity
                      android:name=".MainActivity"
                      android:exported="true"
                      android:launchMode="singleTop"
                      android:theme="@style/LaunchTheme"
                      android:configChanges="orientation|keyboardHidden|keyboard|screenSize|smallestScreenSize|locale|layoutDirection|fontScale|screenLayout|density|uiMode"
                      android:hardwareAccelerated="true"
                      android:windowSoftInputMode="adjustResize">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN"/>
                          <category android:name="android.intent.category.LAUNCHER"/>
                      </intent-filter>
                  </activity>
              </application>
          </manifest>
          EOF
          python3 -c "
          import os, glob
          for path in glob.glob('android/app/build.gradle*'):
              with open(path, 'r') as f: content = f.read()
              content = content.replace('flutter.minSdkVersion', '21')
              with open(path, 'w') as f: f.write(content)
          "
      - name: Get Dependencies
        script: |
          flutter pub get
      - name: Build APK Release
        script: |
          flutter build apk --release --no-tree-shake-icons
    artifacts:
      - build/app/outputs/flutter-apk/*.apk
