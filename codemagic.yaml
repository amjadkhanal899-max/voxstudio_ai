workflows:
  android-workflow:
    name: VoxStudio AI APK Build
    max_build_duration: 60
    instance_type: mac_mini_m1
    environment:
      flutter: stable
      java: 17
    scripts:
      - name: Create Android Project & Set AdMob / MinSDK
        script: |
          rm -rf android
          flutter create --org com.voxstudio.app --platforms=android --no-pub .
          
          # AndroidManifest.xml setup
          cat <<'EOF' > android/app/src/main/AndroidManifest.xml
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">
              <uses-permission android:name="android.permission.INTERNET"/>
              <application
                  android:label="VoxStudio AI"
                  android:name="${applicationName}"
                  android:icon="@mipmap/ic_launcher">
                  <meta-data
                      android:name="com.google.android.gms.ads.APPLICATION_ID"
                      android:value="ca-app-pub-3940256099942544~3347511713"/>
                  <activity
                      android:name=".MainActivity"
                      android:exported="true"
                      android:launchMode="singleTop"
                      android:theme="@style/LaunchTheme"
                      android:configChanges="orientation|keyboardHidden|keyboard|screenSize|smallestScreenSize|locale|layoutDirection|fontScale|screenLayout|density|uiMode"
                      android:hardwareAccelerated="true"
                      android:windowSoftInputMode="adjustResize">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN"/>
                          <category android:name="android.intent.category.LAUNCHER"/>
                      </intent-filter>
                  </activity>
              </application>
          </manifest>
          EOF

          # Smart Python script checking both gradle and gradle.kts
          python3 -c "
          import os
          files = ['android/app/build.gradle', 'android/app/build.gradle.kts']
          for path in files:
              if os.path.exists(path):
                  with open(path, 'r') as f:
                      content = f.read()
                  content = content.replace('flutter.minSdkVersion', '21')
                  with open(path, 'w') as f:
                      f.write(content)
                  print(f'Successfully updated {path}')
          "
      - name: Get Dependencies
        script: |
          flutter pub get
      - name: Build APK Release
        script: |
          flutter build apk --release
    artifacts:
      - build/app/outputs/flutter-apk/*.apk
