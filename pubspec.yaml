workflows:
  android-workflow:
    name: Android Workflow
    max_build_duration: 60
    instance_type: mac_mini_m2
    environment:
      flutter: stable
    scripts:
      - name: Fix V1 Embedding Error
        script: |
          rm -rf android
          flutter create . --platforms=android --project-name voxstudio_ai --org com.example
      - name: Set minSdk for AdMob
        script: |
          echo "flutter.minSdkVersion=23" >> android/local.properties
      - name: Add AdMob ID
        script: |
          MANIFEST="android/app/src/main/AndroidManifest.xml"
          if ! grep -q "com.google.android.gms.ads.APPLICATION_ID" "$MANIFEST"; then
            sed -i.bak 's/<application/<application>\n        <meta-data android:name="com.google.android.gms.ads.APPLICATION_ID" android:value="ca-app-pub-3940256099942544~3347511713"\/>/' "$MANIFEST" || true
          fi
      - name: Build APK
        script: |
          flutter pub get
          flutter build apk --release
    artifacts:
      - build/**/outputs/**/*.apk
